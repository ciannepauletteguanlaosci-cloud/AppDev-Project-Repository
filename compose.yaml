name: penny-wais
services:
  app:
    build: .
    ports:
      - "${PENNY_BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests:ro
      - penny-data:/data
    environment:
      PENNY_WALLET_PREVIEW_EMAIL: ${PENNY_WALLET_PREVIEW_EMAIL:-}
      PENNY_DB: /data/penny.db
      PENNY_DEV: "1"
      WATCHFILES_FORCE_POLLING: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      BRANKAS_API_KEY: ${BRANKAS_API_KEY:-}
      BRANKAS_ENVIRONMENT: ${BRANKAS_ENVIRONMENT:-sandbox}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
volumes:
  penny-data:
